[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "co-vector-fr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gdal>=3.6",
    "shapely>=2.1",
    "pyogrio>=0.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "geopandas>=0.14",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "responses>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["integration: tests nécessitant des données réelles (désactivés par défaut)"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
