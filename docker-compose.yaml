services:
  lidar-o:
    build: .
    volumes:
      - ./LIDAR:/app/LIDAR          # Dalles LiDAR en entrée
      - ./data:/app/data            # BD TOPO en entrée
      - ./out_kp:/app/out_kp        # DXF Karttapullautin (optionnel, pour le relief)
      - ./output:/app/output        # Résultats en sortie
      - ./config.yaml:/app/config.yaml  # Config terrain (écrite par init)
      - ./assets:/app/assets        # CRT + jeu ISOM (lu par le pipeline)
    environment:
      - PYTHONUNBUFFERED=1

  test:
    build: .
    volumes:
      - .:/app
    command: pytest tests/ -v --tb=short
    profiles: [test]
